<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chapter 18 - A Magical Journey</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Georgia',serif;touch-action:manipulation}
body{background:#0d0520;color:#fff}
canvas#pc{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;opacity:0;transition:opacity 1s ease}
.scr.act{display:flex;opacity:1}

/* Buttons */
.btn-magic{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a0a2e;border:none;padding:16px 40px;font-size:clamp(16px,3vw,20px);font-family:inherit;font-weight:bold;border-radius:50px;cursor:pointer;box-shadow:0 4px 30px rgba(255,215,0,0.4);transition:all 0.3s;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
.btn-magic:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 6px 40px rgba(255,215,0,0.6)}
.btn-magic:active{transform:scale(0.95)}
.btn-final{font-size:clamp(18px,4vw,26px);padding:20px 50px;animation:btnPulse 2s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 30px rgba(255,215,0,0.4)}50%{box-shadow:0 4px 50px rgba(255,215,0,0.8)}}

/* Start Number */
.big18{font-size:clamp(120px,25vw,280px);font-weight:bold;color:#ffd700;text-shadow:0 0 40px #ffd700,0 0 80px #ff8c00,0 0 120px #ff6600;animation:numFloat 3s ease-in-out infinite,numGlow 2s ease-in-out infinite alternate;line-height:1}
@keyframes numFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes numGlow{0%{filter:brightness(1)}100%{filter:brightness(1.3)}}

/* Map Nodes */
.ch-node{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-weight:bold;font-size:15px;-webkit-tap-highlight-color:transparent}
.ch-node.unlocked{background:linear-gradient(135deg,#4a9c5e,#2d7a3e);border:3px solid #6fcf7c;box-shadow:0 0 15px rgba(100,200,120,0.5);animation:nodeReady 2s infinite}
.ch-node.done{background:linear-gradient(135deg,#ffd700,#ff8c00);border:3px solid #ffed4a;box-shadow:0 0 20px rgba(255,215,0,0.6);cursor:default}
.ch-node.locked{background:rgba(60,60,80,0.5);border:3px solid rgba(100,100,120,0.3);cursor:not-allowed;opacity:0.4}
@keyframes nodeReady{0%,100%{box-shadow:0 0 15px rgba(100,200,120,0.5)}50%{box-shadow:0 0 25px rgba(100,200,120,0.8)}}

/* Final Gate */
.final-gate{border-radius:14px!important}
.gate-struct{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#2a1a4a,#1a0a3a);border:3px solid #ffd700;border-radius:14px;box-shadow:0 0 30px rgba(255,215,0,0.3);position:relative;overflow:hidden}
.gate-struct .num{font-size:26px;font-weight:bold;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.8)}
.gate-struct .lock{font-size:18px;margin-top:4px;opacity:0.8}
.final-gate.locked .gate-struct{border-color:rgba(255,215,0,0.3);box-shadow:0 0 15px rgba(255,215,0,0.1)}
.final-gate:not(.locked) .gate-struct{animation:gateGlow 2s infinite}
@keyframes gateGlow{0%,100%{box-shadow:0 0 30px rgba(255,215,0,0.3)}50%{box-shadow:0 0 50px rgba(255,215,0,0.7)}}

/* Puzzle Counter HUD */
.puzzle-ctr{background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.3);padding:8px 16px;border-radius:20px;font-size:clamp(13px,2.5vw,16px);color:#ffd700;font-weight:bold}
.big-ctr{font-size:clamp(28px,6vw,44px);padding:20px 40px;border-radius:30px;animation:ctrGlow 1.5s infinite;border:2px solid rgba(255,215,0,0.5)}
@keyframes ctrGlow{0%,100%{box-shadow:0 0 20px rgba(255,215,0,0.3)}50%{box-shadow:0 0 40px rgba(255,215,0,0.6)}}

/* Finale Animations */
.fadeIn{animation:fadeIn 1s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

.orbiting-pieces{position:relative;width:200px;height:200px;margin:0 auto}
.orb-p{position:absolute;top:50%;left:50%;font-size:22px;animation:orbitP 4s linear infinite}
@keyframes orbitP{to{transform:rotate(calc(var(--a) + 360deg)) translateX(80px) rotate(calc(-1*(var(--a) + 360deg)))}}

.golden-key{font-size:80px;animation:keyForm 2s ease-out forwards;filter:drop-shadow(0 0 20px #ffd700)}
@keyframes keyForm{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

.key-fly{font-size:60px;filter:drop-shadow(0 0 15px #ffd700);animation:keyFly 2.5s ease-in-out infinite}
@keyframes keyFly{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-20px) rotate(5deg)}}

.gate-opening{display:flex;align-items:center;justify-content:center;height:250px;position:relative}
.gate-door{width:55px;height:180px;background:linear-gradient(to bottom,#5a4a2a,#2a1a0a);border:2px solid #ffd700}
.gate-door.left{border-radius:8px 0 0 8px;animation:goL 3s ease forwards}
.gate-door.right{border-radius:0 8px 8px 0;animation:goR 3s ease forwards}
.gate-light{width:4px;height:180px;background:#ffd700;box-shadow:0 0 40px #ffd700,0 0 80px #ff8c00;animation:lightGrow 3s ease forwards}
@keyframes goL{to{transform:translateX(-50px) rotateY(-20deg);opacity:0.5}}
@keyframes goR{to{transform:translateX(50px) rotateY(20deg);opacity:0.5}}
@keyframes lightGrow{to{width:150px;box-shadow:0 0 100px #ffd700,0 0 150px #ff8c00}}

.portal-expand{width:10px;height:10px;background:#ffd700;border-radius:50%;box-shadow:0 0 60px #ffd700;animation:portalExp 2.5s ease forwards}
@keyframes portalExp{to{width:120vmax;height:120vmax;background:#fffde8;opacity:0.95}}

/* Cake */
.cake-wrap{position:relative;width:180px;height:260px;margin:0 auto}
.cake-stand{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:150px;height:14px;background:linear-gradient(#c9a050,#8b6914);border-radius:0 0 6px 6px}
.cake-l{position:absolute;left:50%;transform:translateX(-50%);border-radius:10px}
.cake-l.l1{bottom:14px;width:130px;height:48px;background:linear-gradient(#f5e6d3,#d4a574)}
.cake-l.l2{bottom:62px;width:110px;height:42px;background:linear-gradient(#fce4ec,#f8bbd9)}
.cake-l.l3{bottom:104px;width:90px;height:38px;background:linear-gradient(#fff3e0,#ffe0b2)}
.cake-frost{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);width:95px;height:10px;background:#fff;border-radius:5px;box-shadow:0 2px 8px rgba(255,255,255,0.4)}
.cake-decor{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);width:120px;height:7px;background:repeating-linear-gradient(90deg,#ff6b6b 0 8px,#4ecdc4 8px 16px);border-radius:4px}
.cake-ribbon{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:135px;height:9px;background:linear-gradient(90deg,#ffd700,#ff8c00);border-radius:5px}
.cake-candy{position:absolute;bottom:148px;left:50%;transform:translateX(-50%);font-size:14px}
.cake-candy::after{content:'\1F36C \1F36D \1F36B \1F36C'}
.cake-part{opacity:0;transform:translateY(10px);transition:all 0.5s ease}
.cake-part.show{opacity:1;transform:translateY(0)}

/* Candles */
.candles-row{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);display:flex;gap:2px;flex-wrap:wrap;justify-content:center;width:90px}
.candle{width:4px;height:20px;background:linear-gradient(#ff9ff3,#f368e0);border-radius:2px 2px 0 0;opacity:0;transform:scaleY(0);transition:all 0.3s ease}
.candle.vis{opacity:1;transform:scaleY(1)}
.flame{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:5px;height:9px;background:radial-gradient(ellipse,#fff,#ffd700 40%,#ff6600);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;transition:all 0.3s;box-shadow:0 0 6px #ffd700,0 0 12px #ff8c00}
.flame.lit{opacity:1;animation:flicker 0.4s infinite alternate}
.flame.out{opacity:0;transform:translateX(-50%) translateY(-15px) scale(0)}
@keyframes flicker{0%{transform:translateX(-50%) scaleY(1)}100%{transform:translateX(-50%) scaleY(1.15) scaleX(0.85)}}

/* Region Labels */
.region-label{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.3);text-transform:uppercase;white-space:nowrap;pointer-events:none}

@media(max-width:600px){
  .ch-node{font-size:12px!important}
  .final-gate{width:75px!important;height:75px!important}
  .gate-struct .num{font-size:20px!important}
  .cake-wrap{transform:scale(0.75);transform-origin:center bottom}
}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<div id="game"></div>
<script>
// ===== GAME STATE =====
const G={state:'start',progress:0,completed:new Array(18).fill(false),mapScroll:0,particles:[],confetti:[],currentChapter:0};

// ===== PARTICLE SYSTEM =====
const canvas=document.getElementById('pc'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();

function mkP(x,y,col,sz,spd,life){
  return{x:x??Math.random()*canvas.width,y:y??Math.random()*canvas.height,
    col:col||'hsla('+(40+Math.random()*30)+',100%,70%,'+(0.3+Math.random()*0.5)+')',
    sz:sz||(1+Math.random()*3),vx:(Math.random()-0.5)*(spd||0.5),
    vy:-Math.random()*(spd||0.5)-0.2,life:life||(200+Math.random()*300),ml:life||(200+Math.random()*300)}
}
for(let i=0;i<50;i++)G.particles.push(mkP());

function drawP(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0||p.y<-10||p.x<-10||p.x>canvas.width+10){G.particles[i]=mkP();continue}
    ctx.globalAlpha=p.life/p.ml;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,6.28);ctx.fillStyle=p.col;ctx.fill()
  }
  for(let i=G.confetti.length-1;i>=0;i--){
    const c=G.confetti[i];c.x+=c.vx;c.y+=c.vy;c.vy+=0.08;c.r+=c.vr;c.life--;
    if(c.life<=0){G.confetti.splice(i,1);continue}
    ctx.globalAlpha=Math.min(1,c.life/60);ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);
    ctx.fillStyle=c.col;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore()
  }
  ctx.globalAlpha=1;requestAnimationFrame(drawP)
}
drawP();

function burst(x,y,n,col){for(let i=0;i<n;i++)G.particles.push(mkP(x+(Math.random()-0.5)*40,y+(Math.random()-0.5)*40,col||'hsla('+(40+Math.random()*40)+',100%,70%,0.8)',2+Math.random()*3,2+Math.random()*2,60+Math.random()*60))}
function confetti(x,y,n){
  const cols=['#ffd700','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#ff9ff3','#54a0ff','#5f27cd','#00d2d3','#ff6348'];
  for(let i=0;i<n;i++)G.confetti.push({x:x??Math.random()*canvas.width,y:y??-10,vx:(Math.random()-0.5)*8,vy:-Math.random()*6-2,w:4+Math.random()*8,h:3+Math.random()*6,col:cols[~~(Math.random()*cols.length)],r:Math.random()*6.28,vr:(Math.random()-0.5)*0.2,life:180+Math.random()*120})
}

// ===== AUDIO =====
let ac;function initA(){if(!ac)ac=new(AudioContext||webkitAudioContext)()}
function tone(f,d,v){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function chime(){tone(523,0.3);setTimeout(()=>tone(659,0.3),100);setTimeout(()=>tone(784,0.4),200)}
function unlockSnd(){tone(392,0.5,0.05);setTimeout(()=>tone(523,0.4),200);setTimeout(()=>tone(659,0.4),400);setTimeout(()=>tone(784,0.6),600)}

// ===== DOM =====
const game=document.getElementById('game');
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h)e.innerHTML=h;return e}

// ===== SCREEN SYSTEM =====
function show(id){
  const old=game.querySelector('.scr');
  if(old){old.style.opacity='0';setTimeout(()=>old.remove(),600)}
  setTimeout(()=>{const s=R[id]();game.appendChild(s);requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('act')))},old?650:10)
}

// ===== RENDERERS =====
const R={};

// START
R.start=function(){
  const s=el('div','scr');
  s.innerHTML='<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,#2d1b69 0%,#1a0a2e 50%,#0d0520 100%)"></div><div style="position:relative;z-index:2;text-align:center;padding:20px"><div class="big18">18</div><p style="font-size:clamp(14px,3vw,20px);color:#c9a0ff;margin:20px 0 40px;letter-spacing:3px;opacity:0.8">A MAGICAL JOURNEY AWAITS</p><button class="btn-magic" id="startBtn">START</button></div>';
  s.querySelector('#startBtn').onclick=()=>{initA();chime();show('intro')};
  return s;
};

// INTRO
R.intro=function(){
  const s=el('div','scr');
  s.innerHTML='<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a1040,#0d0520)"></div><div style="position:relative;z-index:2;text-align:center;max-width:600px;padding:40px"><div style="font-size:clamp(18px,4vw,26px);line-height:1.8;color:#e8d5ff;margin-bottom:50px">[INTRO_TEXT_PLACEHOLDER]</div><button class="btn-magic" id="goBtn">BEGIN ADVENTURE</button></div>';
  s.querySelector('#goBtn').onclick=()=>{chime();show('map')};
  return s;
};

// MAP
R.map=function(){
  const s=el('div','scr');
  const H=4200,W=400;
  const cy=i=>H-200-i*((H-400)/18);
  const cx=i=>200+Math.sin(i*0.75)*130;
  
  let svg='<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">';
  // Path
  let d='M '+cx(0)+' '+cy(0);
  for(let i=1;i<18;i++){const px=cx(i-1),py=cy(i-1),x=cx(i),y=cy(i);d+=' C '+(px+(i%2?60:-60))+' '+(py-60)+' '+(x+(i%2?-60:60))+' '+(y+60)+' '+x+' '+y}
  svg+='<path d="'+d+'" fill="none" stroke="rgba(255,215,0,0.08)" stroke-width="30" stroke-linecap="round"/>';
  svg+='<path d="'+d+'" fill="none" stroke="rgba(255,215,0,0.2)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 8"/>';
  svg+='</svg>';
  
  // Region backgrounds
  const regions=[{n:'The Beginning',c:'#3a6b4a'},{n:'Fields & Rivers',c:'#4a8b5a'},{n:'Bridges & Forests',c:'#3a7b6a'},{n:'The Mountains',c:'#5a6b9a'},{n:'Floating Islands',c:'#7a5ba8'},{n:'Magical Zone',c:'#a05ba0'},{n:'Final Approach',c:'#c09040'}];
  let regHTML='';
  regions.forEach((r,i)=>{
    const top=H-(i+1)*(H/7),h=H/7;
    regHTML+='<div style="position:absolute;left:0;right:0;top:'+top+'px;height:'+h+'px;background:linear-gradient(to bottom,'+r.c+'22,transparent);pointer-events:none"></div>';
    regHTML+='<div class="region-label" style="top:'+(top+h/2-8)+'px">'+r.n+'</div>';
  });
  
  // Nodes
  let nodes='';
  for(let i=0;i<18;i++){
    const x=(cx(i)/W)*100,y=cy(i);
    const unlocked=i===0||G.completed[i-1],done=G.completed[i],isFinal=i===17;
    const sz=isFinal?80:42;
    if(isFinal){
      const lk=G.progress<17;
      nodes+='<div class="ch-node final-gate '+(lk?'locked':'')+'" data-ch="'+i+'" style="position:absolute;left:calc('+x+'% - 40px);top:'+(y-40)+'px;width:80px;height:80px"><div class="gate-struct"><div class="num">18</div>'+(lk?'<div class="lock">\u{1F512}</div>':'')+'</div></div>';
    } else {
      const cls=done?'done':(unlocked?'unlocked':'locked');
      nodes+='<div class="ch-node '+cls+'" data-ch="'+i+'" style="position:absolute;left:calc('+x+'% - '+sz/2+'px);top:'+(y-sz/2)+'px;width:'+sz+'px;height:'+sz+'px"><span>'+(i+1)+'</span></div>';
    }
  }
  
  // World evolution: more decorative particles based on progress
  let decoHTML='';
  const decoCount=G.progress*3;
  for(let i=0;i<decoCount;i++){
    const dx=Math.random()*100,dy=Math.random()*100;
    decoHTML+='<div style="position:absolute;left:'+dx+'%;top:'+dy+'%;width:3px;height:3px;background:rgba(255,215,0,'+(0.2+Math.random()*0.3)+');border-radius:50%;animation:numFloat '+(2+Math.random()*3)+'s ease-in-out infinite;animation-delay:'+(Math.random()*2)+'s;pointer-events:none"></div>';
  }
  
  s.innerHTML='<div style="position:absolute;inset:0;background:linear-gradient(to top,#0a1628,#0d0520,#1a0a2e);overflow:hidden"><div id="mapC" style="position:absolute;width:100%;height:'+H+'px;will-change:transform">'+regHTML+svg+decoHTML+nodes+'</div></div><div style="position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(13,5,32,0.95),transparent);z-index:100;pointer-events:none"><div style="font-size:clamp(11px,2.5vw,15px);color:#c9a0ff;letter-spacing:2px">CHAPTER 18</div><div class="puzzle-ctr">'+G.progress+'/18 \u{1F9E9}</div></div>';
  
  setTimeout(()=>{
    const mc=document.getElementById('mapC');if(!mc)return;
    const vh=innerHeight;
    // Scroll to current progress
    const target=G.progress<18?cy(Math.min(G.progress,17)):cy(17);
    let scroll=Math.max(0,Math.min(H-vh,target-vh/2));
    mc.style.transform='translateY('+(-scroll)+'px)';
    
    // Touch scrolling
    let sy=0,ss=0,drag=false;
    const wrap=mc.parentElement;
    wrap.ontouchstart=e=>{sy=e.touches[0].clientY;ss=scroll;drag=true;mc.style.transition='none'};
    wrap.ontouchmove=e=>{if(!drag)return;e.preventDefault();scroll=Math.max(0,Math.min(H-vh,ss+(sy-e.touches[0].clientY)));mc.style.transform='translateY('+(-scroll)+'px)'};
    wrap.ontouchend=()=>{drag=false;mc.style.transition='transform 0.3s ease'};
    wrap.onwheel=e=>{e.preventDefault();scroll=Math.max(0,Math.min(H-vh,scroll+e.deltaY*0.8));mc.style.transform='translateY('+(-scroll)+'px)';mc.style.transition='none';clearTimeout(wrap._t);wrap._t=setTimeout(()=>mc.style.transition='transform 0.3s ease',80)};
    
    // Click handlers
    mc.querySelectorAll('.ch-node').forEach(n=>n.onclick=()=>{
      const ch=+n.dataset.ch;
      if(n.classList.contains('locked'))return;
      if(n.classList.contains('done'))return;
      G.currentChapter=ch;chime();show('chapter');
    });
  },100);
  return s;
};

// CHAPTER
R.chapter=function(){
  const ch=G.currentChapter;
  const rNames=['The Beginning','The Beginning','The Beginning','Fields & Rivers','Fields & Rivers','Fields & Rivers','Bridges & Forests','Bridges & Forests','The Mountains','The Mountains','The Mountains','Floating Islands','Floating Islands','Magical Zone','Magical Zone','Magical Zone','Final Approach','Chapter 18'];
  const rCols=['#3a6b4a','#3a6b4a','#3a6b4a','#4a8b5a','#4a8b5a','#4a8b5a','#3a7b6a','#3a7b6a','#5a6b9a','#5a6b9a','#5a6b9a','#7a5ba8','#7a5ba8','#a05ba0','#a05ba0','#a05ba0','#c09040','#ffd700'];
  const s=el('div','scr');
  let extra='';
  if(ch===16)extra='<p style="color:#ffd700;font-size:clamp(16px,3vw,20px);margin-top:20px;animation:numFloat 2s infinite">One piece remains...</p>';
  s.innerHTML='<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,'+rCols[ch]+'33,#0d0520)"></div><div style="position:relative;z-index:2;text-align:center;padding:30px;max-width:600px;width:90%"><div style="font-size:12px;color:'+rCols[ch]+';letter-spacing:3px;margin-bottom:8px;text-transform:uppercase">'+rNames[ch]+'</div><h1 style="font-size:clamp(36px,8vw,56px);color:#ffd700;margin-bottom:30px;text-shadow:0 0 20px rgba(255,215,0,0.5)">Chapter '+(ch+1)+'</h1><div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,215,0,0.15);border-radius:16px;padding:30px;margin-bottom:30px;min-height:120px;display:flex;align-items:center;justify-content:center"><p style="font-size:clamp(15px,3vw,19px);color:#e8d5ff;line-height:1.6">[CHAPTER_CONTENT_PLACEHOLDER]</p></div>'+extra+'<button class="btn-magic" id="colBtn">Collect Puzzle Piece \u{1F9E9}</button></div>';
  s.querySelector('#colBtn').onclick=()=>{
    G.completed[ch]=true;G.progress++;
    burst(canvas.width/2,canvas.height/2,30);chime();
    if(G.progress>=18){show('finale')}else{show('map')}
  };
  return s;
};

// FINALE
R.finale=function(){
  const s=el('div','scr');
  s.innerHTML='<div style="position:absolute;inset:0;background:#0d0520"></div><div id="fStage" style="position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"></div>';
  setTimeout(()=>runFinale(),800);
  return s;
};

// ===== FINALE SEQUENCE =====
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function runFinale(){
  const st=document.getElementById('fStage');if(!st)return;
  
  // Phase 1 - Completion
  st.innerHTML='<div class="fadeIn"><div class="big-ctr puzzle-ctr">18/18 \u{1F9E9}</div><p style="color:#c9a0ff;margin-top:25px;font-size:clamp(16px,3vw,20px)">All pieces collected...</p></div>';
  burst(canvas.width/2,canvas.height/2,50,'hsla(45,100%,70%,0.9)');chime();
  await sleep(3500);
  
  // Phase 2 - Puzzle Awakening
  let orbHTML='<div class="fadeIn"><div class="orbiting-pieces" style="position:relative;width:200px;height:200px;margin:0 auto">';
  for(let i=0;i<18;i++)orbHTML+='<div class="orb-p" style="position:absolute;top:50%;left:50%;--a:'+(i*20)+'deg;transform:rotate('+(i*20)+'deg) translateX(80px)">\u{1F9E9}</div>';
  orbHTML+='</div><p style="color:#ffd700;margin-top:30px;font-size:clamp(16px,3vw,18px)">The pieces awaken...</p></div>';
  st.innerHTML=orbHTML;
  await sleep(4000);
  
  // Phase 3 - Key Creation
  st.innerHTML='<div class="fadeIn"><div style="position:relative;display:inline-block"><div style="position:absolute;inset:-50px;background:radial-gradient(circle,rgba(255,215,0,0.3),transparent);border-radius:50%;animation:btnPulse 2s infinite"></div><div class="golden-key">\u{1F511}</div></div><p style="color:#ffd700;margin-top:30px;font-size:clamp(17px,3.5vw,22px)">A magical key is born...</p></div>';
  unlockSnd();burst(canvas.width/2,canvas.height/2,40,'hsla(45,100%,65%,0.9)');
  await sleep(4500);
  
  // Phase 4 - Return to Gate
  st.innerHTML='<div class="fadeIn"><div class="key-fly" style="font-size:70px;filter:drop-shadow(0 0 20px #ffd700)">\u{1F511}</div><p style="color:#c9a0ff;margin-top:40px;font-size:clamp(15px,3vw,18px)">The key seeks its lock...</p></div>';
  await sleep(3500);
  
  // Phase 5 - The Lock
  st.innerHTML='<div class="fadeIn" style="position:relative"><div style="font-size:100px;filter:drop-shadow(0 0 30px #ffd700);animation:numFloat 2s infinite">\u{1F3F0}</div><div style="position:absolute;top:60%;left:50%;transform:translate(-50%,-50%);font-size:40px;animation:keyForm 1.5s ease forwards">\u{1F511}</div><p style="color:#ffd700;margin-top:40px;font-size:clamp(15px,3vw,18px)">Energy surges through the gate...</p></div>';
  burst(canvas.width/2,canvas.height/2,60,'hsla(45,100%,60%,0.8)');unlockSnd();
  await sleep(4000);
  
  // Phase 6 - Gate Opening
  st.innerHTML='<div class="fadeIn"><div class="gate-opening"><div class="gate-door left"></div><div class="gate-light"></div><div class="gate-door right"></div></div><p style="color:#ffd700;margin-top:30px;font-size:clamp(16px,3.5vw,20px)">The gate opens...</p></div>';
  await sleep(4500);
  
  // Phase 7 - Entering
  st.innerHTML='<div class="fadeIn" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div class="portal-expand"></div></div>';
  await sleep(3000);
  
  // Phase 8 - Cake Creation
  st.style.background='radial-gradient(ellipse at center bottom,#2a1040,#0d0520)';
  st.innerHTML='<div class="fadeIn" style="margin-top:40px"><div class="cake-wrap" id="cakeW"></div></div>';
  const cw=document.getElementById('cakeW');
  const parts=['cake-stand','cake-l l1','cake-l l2','cake-l l3','cake-frost','cake-decor','cake-ribbon','cake-candy',''];
  for(let i=0;i<parts.length-1;i++){
    await sleep(550);
    const d=document.createElement('div');d.className='cake-part '+parts[i];cw.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('show')));
    burst(canvas.width/2,canvas.height/2+30,6,'hsla(330,80%,70%,0.8)');tone(280+i*45,0.2,0.03);
  }
  await sleep(1200);
  
  // Phase 9 - Candles
  let cHTML='<div class="candles-row">';
  for(let i=0;i<18;i++)cHTML+='<div class="candle" id="c'+i+'"><div class="flame" id="f'+i+'"></div></div>';
  cHTML+='</div>';
  const cDiv=document.createElement('div');cDiv.className='cake-part';cDiv.innerHTML=cHTML;cw.appendChild(cDiv);
  requestAnimationFrame(()=>cDiv.classList.add('show'));
  
  for(let i=0;i<18;i++){await sleep(180);const c=document.getElementById('c'+i);if(c)c.classList.add('vis')}
  await sleep(600);
  for(let i=0;i<18;i++){await sleep(140);const f=document.getElementById('f'+i);if(f)f.classList.add('lit');tone(380+i*18,0.1,0.02)}
  await sleep(2500);
  
  // Phase 10 - Celebration
  confetti(canvas.width/2,0,120);burst(canvas.width/2,canvas.height/3,60,'hsla(50,100%,70%,0.9)');
  for(let i=0;i<5;i++)setTimeout(()=>confetti(Math.random()*canvas.width,0,40),i*350);
  await sleep(4500);
  
  // Phase 11 - Message
  st.innerHTML='<div class="fadeIn" style="padding:30px"><div style="font-size:clamp(22px,5.5vw,44px);color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,0.5);line-height:1.6">[FINAL_BIRTHDAY_MESSAGE_PLACEHOLDER]</div></div>';
  confetti(canvas.width/2,0,60);
  await sleep(5500);
  
  // Phase 12 - Final Button
  st.innerHTML='<div class="fadeIn" style="padding:30px"><div style="font-size:clamp(18px,4.5vw,34px);color:#ffd700;margin-bottom:40px;text-shadow:0 0 20px rgba(255,215,0,0.4);line-height:1.5">[FINAL_BIRTHDAY_MESSAGE_PLACEHOLDER]</div><button class="btn-magic btn-final" id="blowBtn">[FINAL_BUTTON_PLACEHOLDER]</button></div>';
  
  await new Promise(res=>{document.getElementById('blowBtn').onclick=res});
  
  // Phase 13 - Blow Out Candles
  burst(canvas.width/2,canvas.height/2,80,'hsla(200,80%,85%,0.8)');
  for(let i=0;i<60;i++)G.particles.push(mkP(canvas.width/2+(Math.random()-0.5)*200,canvas.height/2,'hsla(45,100%,90%,0.8)',2+Math.random()*2,2.5,120));
  tone(180,1.2,0.04);
  await sleep(2000);
  
  // Phase 14 - Ending
  st.innerHTML='<div class="fadeIn" style="text-align:center"><div style="font-size:clamp(40px,10vw,80px);margin-bottom:20px">\u2728</div><div style="font-size:clamp(14px,3vw,18px);color:rgba(255,215,0,0.6);letter-spacing:3px">THE END</div></div>';
  
  // Continuous gentle celebration forever
  setInterval(()=>{
    if(Math.random()>0.6)confetti(Math.random()*canvas.width,-20,3);
    G.particles.push(mkP(Math.random()*canvas.width,canvas.height+10,'hsla('+(30+Math.random()*30)+',100%,75%,0.5)',1.5+Math.random()*2,0.8,250));
  },400);
  
  await sleep(6000);
  st.style.transition='opacity 10s ease';st.style.opacity='0.4';
}

// ===== START =====
show('start');
</script>
</body>
</html>
