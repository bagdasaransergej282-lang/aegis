<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chapter 18</title>
<style>
:root{--gold:#ffd700;--dark:#0f0a1e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Trebuchet MS',sans-serif;touch-action:manipulation}
body{background:var(--dark);color:#fff}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;opacity:0;transition:opacity .6s}
.scr.act{display:flex;opacity:1}
.btn{background:linear-gradient(180deg,#ffe566,#f5a623);color:#4a2800;border:none;padding:18px 48px;font:900 clamp(16px,3.5vw,22px)/1 inherit;border-radius:40px;cursor:pointer;box-shadow:0 5px 0 #b87a00,0 8px 20px rgba(0,0,0,.4);position:relative;top:0;transition:top .1s,box-shadow .1s;letter-spacing:.5px}
.btn:active{top:4px;box-shadow:0 1px 0 #b87a00}
.btn-glow{animation:bG 2s infinite}
@keyframes bG{0%,100%{box-shadow:0 5px 0 #b87a00,0 0 20px rgba(255,215,0,.3)}50%{box-shadow:0 5px 0 #b87a00,0 0 40px rgba(255,215,0,.6)}}
.start-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a0533,#2d1b69 50%,#1a0a2e);overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.5)}}
.num18{font-size:clamp(130px,28vw,300px);font-weight:900;background:linear-gradient(180deg,#fff,#ffd700 40%,#ff8c00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 6px 20px rgba(255,165,0,.6));animation:fl 3s ease-in-out infinite;line-height:1}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.map-outer{position:absolute;inset:0;overflow:hidden}
.map-inner{position:absolute;width:100%;will-change:transform}
.road-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:52px;height:66px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.node:active{transform:scale(.88)!important}
.node-c{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 15px/1 inherit;position:relative;z-index:2}
.node-p{width:16px;height:24px;background:linear-gradient(90deg,#7a6040,#5a4030);border-radius:3px;margin-top:-3px;box-shadow:2px 0 0 rgba(0,0,0,.2)}
.node-g{position:absolute;inset:-10px;border-radius:50%;opacity:0}
.node.locked .node-c{background:#3a3a4a;color:#666;border:3px solid #4a4a5a}
.node.locked .node-p{opacity:.3}
.node.open .node-c{background:linear-gradient(135deg,#5aff7a,#00cc55);color:#fff;border:3px solid #8fff8f;box-shadow:0 0 18px rgba(80,255,120,.7)}
.node.open .node-g{opacity:1;background:radial-gradient(circle,rgba(80,255,120,.4),transparent);animation:np 1.8s infinite}
.node.done .node-c{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#4a2800;border:3px solid #ffe066;box-shadow:0 0 14px rgba(255,200,0,.5)}
.node.done .node-g{opacity:.4;background:radial-gradient(circle,rgba(255,215,0,.3),transparent)}
@keyframes np{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}
.nf{width:100px;height:110px;position:absolute;cursor:pointer}
.nf:active{transform:scale(.9)!important}
.nf-body{width:80px;height:56px;background:linear-gradient(180deg,#6c3fa0,#4a2080);border-radius:12px 12px 4px 4px;border:3px solid #9b6fcc;box-shadow:0 4px 16px rgba(100,50,160,.6);position:relative;margin:0 auto}
.nf-body::before{content:'';position:absolute;top:-16px;left:50%;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:18px solid #8b5cf6}
.nf-body::after{content:'18';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 24px/1 inherit;color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.6)}
.nf-flag{text-align:center;font-size:18px;animation:fw 1s ease-in-out infinite;margin-bottom:2px}
@keyframes fw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.nf-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.4),transparent);animation:np 2.5s infinite}
.nf-label{text-align:center;margin-top:6px;font:900 8px/1 inherit;background:linear-gradient(135deg,#ff1493,#ff4500);color:#fff;padding:4px 8px;border-radius:8px;display:inline-block}
.nf.locked{opacity:.3;filter:grayscale(.8)}
.nf:not(.locked){animation:fl 3.5s ease-in-out infinite}
.hud{position:fixed;top:0;left:0;right:0;height:48px;background:linear-gradient(180deg,rgba(15,10,30,.95) 60%,transparent);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:200;pointer-events:none}
.hud-t{font:900 clamp(11px,2.5vw,14px)/1 inherit;color:var(--gold);letter-spacing:2px}
.hud-c{pointer-events:auto;background:rgba(255,215,0,.1);border:2px solid rgba(255,215,0,.4);border-radius:16px;padding:6px 14px;font:700 clamp(12px,2.4vw,15px)/1 inherit;color:var(--gold)}
.deco{position:absolute;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.fadeUp{animation:fU .8s ease forwards}
@keyframes fU{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.cake{position:relative;width:260px;height:340px;margin:0 auto}
.ck-stand{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:210px;height:18px;background:linear-gradient(#d4a050,#9a7030);border-radius:4px 4px 10px 10px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.ck-t{position:absolute;left:50%;transform:translateX(-50%);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ck-t1{bottom:18px;width:190px;height:62px;background:linear-gradient(#fff0e6,#f0b880);border:3px solid rgba(255,200,140,.6)}
.ck-t2{bottom:76px;width:155px;height:54px;background:linear-gradient(#ffe8f2,#ffb0d8);border:3px solid rgba(255,176,216,.6)}
.ck-t3{bottom:126px;width:120px;height:48px;background:linear-gradient(#e6fff0,#80e8b0);border:3px solid rgba(128,232,176,.6)}
.ck-frost{position:absolute;bottom:172px;left:50%;transform:translateX(-50%);width:130px;height:14px;background:#fff;border-radius:7px;box-shadow:0 2px 10px rgba(255,255,255,.5)}
.ck-decor{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);width:162px;height:10px;background:repeating-linear-gradient(90deg,#ff6b6b 0 5px,#4ecdc4 5px 10px,#ffd700 10px 15px,#ff69b4 15px 20px);border-radius:5px}
.ck-ribbon{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);width:195px;height:14px;background:linear-gradient(90deg,#ff1493,#ffd700,#ff1493);border-radius:7px;box-shadow:0 0 10px rgba(255,20,147,.4)}
.ck-cherry{position:absolute;bottom:184px;left:50%;transform:translateX(-50%);font-size:28px}
.ck-p{opacity:0;transform:translateY(20px);transition:all .7s cubic-bezier(.34,1.56,.64,1)}
.ck-p.v{opacity:1;transform:translateY(0)}
.candles{position:absolute;bottom:186px;left:50%;transform:translateX(-50%);display:flex;gap:3px;flex-wrap:wrap;justify-content:center;width:118px}
.cdl{width:6px;height:26px;border-radius:3px 3px 1px 1px;opacity:0;transform:scaleY(0);transition:all .3s;position:relative}
.cdl:nth-child(3n+1){background:linear-gradient(#ff9ff3,#e056a0)}
.cdl:nth-child(3n+2){background:linear-gradient(#74b9ff,#0984e3)}
.cdl:nth-child(3n){background:linear-gradient(#55efc4,#00b894)}
.cdl.v{opacity:1;transform:scaleY(1)}
.flm{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:8px;height:13px;background:radial-gradient(ellipse at 50% 80%,#fff,#ffd700 30%,#ff6600 65%,transparent);border-radius:50%/60% 60% 40% 40%;opacity:0;box-shadow:0 0 8px #ffd700,0 0 16px #ff8c00}
.flm.on{opacity:1;animation:fli .35s infinite alternate}
@keyframes fli{to{transform:translateX(-50%) scaleY(1.2) scaleX(.8)}}
@media(max-width:500px){.node{width:44px;height:56px}.node-c{width:34px;height:34px;font-size:12px}.nf{width:80px;height:90px}.nf-body{width:64px;height:44px}.cake{transform:scale(.6);transform-origin:center bottom}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app"></div>
<script>
const G={p:0,done:Array(18).fill(false),pts:[],cft:[],ch:0};
const cv=document.getElementById('fx'),cx=cv.getContext('2d');
function rsz(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rsz);rsz();
function mkP(x,y,c,s,sp,l){return{x:x??Math.random()*cv.width,y:y??Math.random()*cv.height,c:c||'hsla('+(35+Math.random()*30)+',100%,70%,'+(0.3+Math.random()*0.5)+')',s:s||(1+Math.random()*2.5),vx:(Math.random()-.5)*(sp||.4),vy:-Math.random()*(sp||.4)-.15,l:l||(250+Math.random()*350),ml:l||(250+Math.random()*350)}}
for(let i=0;i<30;i++)G.pts.push(mkP());
function draw(){cx.clearRect(0,0,cv.width,cv.height);for(let i=G.pts.length-1;i>=0;i--){const p=G.pts[i];p.x+=p.vx;p.y+=p.vy;p.l--;if(p.l<=0||p.y<-10){G.pts[i]=mkP();continue}cx.globalAlpha=p.l/p.ml;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.28);cx.fillStyle=p.c;cx.fill()}for(let i=G.cft.length-1;i>=0;i--){const c=G.cft[i];c.x+=c.vx;c.y+=c.vy;c.vy+=.07;c.r+=c.vr;c.l--;if(c.l<=0){G.cft.splice(i,1);continue}cx.globalAlpha=Math.min(1,c.l/50);cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);cx.fillStyle=c.c;cx.fillRect(-c.w/2,-c.h/2,c.w,c.h);cx.restore()}cx.globalAlpha=1;requestAnimationFrame(draw)}draw();
function burst(x,y,n,c){for(let i=0;i<n;i++)G.pts.push(mkP(x+(Math.random()-.5)*40,y+(Math.random()-.5)*40,c||'hsla('+(35+Math.random()*40)+',100%,70%,.8)',2+Math.random()*3,2+Math.random()*2,50+Math.random()*50))}
function confetti(x,y,n){const cs=['#ffd700','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#ff9ff3','#54a0ff','#5f27cd'];for(let i=0;i<n;i++)G.cft.push({x:x??Math.random()*cv.width,y:y??-10,vx:(Math.random()-.5)*8,vy:-Math.random()*6-2,w:4+Math.random()*8,h:3+Math.random()*6,c:cs[~~(Math.random()*cs.length)],r:Math.random()*6.28,vr:(Math.random()-.5)*.2,l:200+Math.random()*100})}
let au;function iA(){if(!au)au=new(AudioContext||webkitAudioContext)()}
function tn(f,d,v){if(!au)return;try{const o=au.createOscillator(),g=au.createGain();o.connect(g);g.connect(au.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v||.04,au.currentTime);g.gain.exponentialRampToValueAtTime(.001,au.currentTime+d);o.start();o.stop(au.currentTime+d)}catch(e){}}
function chime(){tn(523,.3);setTimeout(()=>tn(659,.3),100);setTimeout(()=>tn(784,.4),200)}
function unlock(){tn(392,.5,.05);setTimeout(()=>tn(523,.4),200);setTimeout(()=>tn(659,.4),400);setTimeout(()=>tn(784,.6),600)}
const app=document.getElementById('app');
function el(t,c){const e=document.createElement(t);if(c)e.className=c;return e}
function show(id){const old=app.querySelector('.scr');if(old){old.style.opacity='0';setTimeout(()=>old.remove(),400)}setTimeout(()=>{const s=R[id]();app.appendChild(s);requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('act')))},old?450:10)}
const R={};
// START
R.start=function(){const s=el('div','scr');let stars='';for(let i=0;i<80;i++)stars+='<div class="star" style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(2+Math.random()*3)+'s;--dl:'+(-Math.random()*3)+'s"></div>';s.innerHTML='<div class="start-bg">'+stars+'</div><div style="position:relative;z-index:2;text-align:center;padding:20px"><div class="num18">18</div><p style="font-size:clamp(13px,3vw,18px);color:rgba(255,255,255,.7);margin:16px 0 36px;letter-spacing:4px">A MAGICAL JOURNEY AWAITS</p><button class="btn" id="sB">START ADVENTURE</button></div>';s.querySelector('#sB').onclick=()=>{iA();chime();show('intro')};return s};
// INTRO
R.intro=function(){const s=el('div','scr');s.innerHTML='<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0f0a1e,#1a1040)"></div><div style="position:relative;z-index:2;text-align:center;max-width:560px;padding:40px"><p style="font-size:clamp(17px,3.5vw,24px);line-height:1.9;color:rgba(255,255,255,.8);margin-bottom:44px">[INTRO_TEXT_PLACEHOLDER]</p><button class="btn" id="gB">BEGIN</button></div>';s.querySelector('#gB').onclick=()=>{chime();show('map')};return s};
// MAP
R.map=function(){const s=el('div','scr');const H=5200,W=440;
const P=[{x:140,y:H-220},{x:240,y:H-480},{x:320,y:H-720},{x:220,y:H-960},{x:120,y:H-1200},{x:200,y:H-1440},{x:330,y:H-1680},{x:380,y:H-1920},{x:290,y:H-2160},{x:170,y:H-2400},{x:280,y:H-2640},{x:380,y:H-2880},{x:300,y:H-3120},{x:180,y:H-3360},{x:110,y:H-3600},{x:220,y:H-3840},{x:350,y:H-4080},{x:340,y:H-4380}];
// SVG path
let d='M '+P[0].x+' '+P[0].y;for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];d+=' Q '+((a.x+b.x)/2+(i%2?55:-55))+' '+((a.y+b.y)/2)+' '+b.x+' '+b.y}
// Scenery
const D=[{e:'🌲',x:40,y:H-280,s:28},{e:'🌲',x:390,y:H-400,s:24},{e:'🌳',x:60,y:H-600,s:22},{e:'💐',x:380,y:H-700,s:16},{e:'🌊',x:50,y:H-1100,s:22},{e:'🌸',x:400,y:H-1300,s:16},{e:'🌉',x:70,y:H-1550,s:26},{e:'🌲',x:400,y:H-1800,s:22},{e:'⛰️',x:50,y:H-2050,s:34},{e:'🏔️',x:400,y:H-2300,s:38},{e:'❄️',x:360,y:H-2200,s:16},{e:'🦅',x:80,y:H-2500,s:18},{e:'☁️',x:60,y:H-2750,s:26},{e:'🏝️',x:400,y:H-2950,s:24},{e:'✨',x:50,y:H-3250,s:20},{e:'🔮',x:390,y:H-3450,s:22},{e:'💫',x:80,y:H-3550,s:16},{e:'🌙',x:400,y:H-3700,s:18},{e:'🏰',x:150,y:H-4200,s:24},{e:'🎆',x:380,y:H-4300,s:18}];
const RG=[{n:'Beginning',y:H-50,h:750},{n:'Fields',y:H-800,h:700},{n:'Forests',y:H-1500,h:550},{n:'Mountains',y:H-2050,h:750},{n:'Islands',y:H-2800,h:600},{n:'Magic',y:H-3400,h:750},{n:'Final',y:H-4150,h:500}];
let h='<div class="map-outer"><div class="map-inner" id="mC" style="height:'+H+'px;background:linear-gradient(180deg,#1a0533 0%,#2d1b69 8%,#1e3a20 15%,#1a4a1a 25%,#1a3a20 35%,#1a3540 45%,#1e2850 55%,#2a2060 65%,#351a50 75%,#2a1040 85%,#1a0a30 95%,#0f0520 100%)">';
RG.forEach((r,i)=>{h+='<div style="position:absolute;right:8px;top:'+(r.y+r.h/2)+'px;font:600 8px/1 inherit;letter-spacing:2px;color:rgba(255,255,255,.12);text-transform:uppercase;writing-mode:vertical-lr;pointer-events:none">'+r.n+'</div>'});
h+='<svg class="road-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
h+='<path d="'+d+'" fill="none" stroke="rgba(80,60,35,.7)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>';
h+='<path d="'+d+'" fill="none" stroke="rgba(180,145,90,.65)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>';
h+='<path d="'+d+'" fill="none" stroke="rgba(210,175,120,.25)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 14"/>';
h+='<path d="'+d+'" fill="none" stroke="rgba(100,80,50,.5)" stroke-width="3" stroke-dasharray="12 18" stroke-linecap="round"/>';
h+='</svg>';
D.forEach(o=>{h+='<div class="deco" style="left:'+((o.x/W)*100)+'%;top:'+o.y+'px;font-size:'+o.s+'px">'+o.e+'</div>'});
const ev=G.p*4;for(let i=0;i<ev;i++){h+='<div class="deco" style="left:'+Math.random()*100+'%;top:'+(Math.random()*H)+'px;width:'+(2+Math.random()*3)+'px;height:'+(2+Math.random()*3)+'px;background:rgba(255,215,0,'+(0.15+Math.random()*0.35)+');border-radius:50%;animation:fl '+(2+Math.random()*3)+'s ease-in-out infinite;animation-delay:'+(-Math.random()*3)+'s"></div>'}
for(let i=0;i<18;i++){const p=P[i],px=(p.x/W)*100;const ul=i===0||G.done[i-1],dn=G.done[i];
if(i===17){const lk=G.p<17;h+='<div class="nf '+(lk?'locked':'')+'" data-i="'+i+'" style="left:calc('+px+'% - 50px);top:'+(p.y-100)+'px"><div class="nf-glow"></div><div class="nf-flag">🚩</div><div class="nf-body"></div><div class="nf-label">FINAL LEVEL</div></div>'}
else{const cl=dn?'done':(ul?'open':'locked');h+='<div class="node '+cl+'" data-i="'+i+'" style="left:calc('+px+'% - 26px);top:'+(p.y-56)+'px"><div class="node-g"></div><div class="node-c">'+(i+1)+'</div><div class="node-p"></div></div>'}}
h+='</div></div><div class="hud"><div class="hud-t">CHAPTER 18</div><div class="hud-c">'+G.p+'/18 🧩</div></div>';
s.innerHTML=h;
setTimeout(()=>{const mc=document.getElementById('mC');if(!mc)return;const vh=innerHeight,tg=P[Math.min(G.p,17)];let sc=Math.max(0,Math.min(H-vh,tg.y-vh/2));mc.style.transform='translateY('+(-sc)+'px)';
let sy=0,ss=0,dr=false;const wr=mc.parentElement;
wr.ontouchstart=e=>{sy=e.touches[0].clientY;ss=sc;dr=true;mc.style.transition='none'};
wr.ontouchmove=e=>{if(!dr)return;e.preventDefault();sc=Math.max(0,Math.min(H-vh,ss+(sy-e.touches[0].clientY)));mc.style.transform='translateY('+(-sc)+'px)'};
wr.ontouchend=()=>{dr=false;mc.style.transition='transform .3s ease'};
wr.onwheel=e=>{e.preventDefault();sc=Math.max(0,Math.min(H-vh,sc+e.deltaY));mc.style.transform='translateY('+(-sc)+'px)';mc.style.transition='none';clearTimeout(wr._t);wr._t=setTimeout(()=>mc.style.transition='transform .3s ease',80)};
mc.querySelectorAll('[data-i]').forEach(n=>n.onclick=()=>{const i=+n.dataset.i;if(n.classList.contains('locked')||n.classList.contains('done'))return;G.ch=i;chime();show('ch')})},80);return s};
// CHAPTER
R.ch=function(){const i=G.ch;const rn=['Beginning','Beginning','Beginning','Fields','Fields','Fields','Forests','Forests','Mountains','Mountains','Mountains','Islands','Islands','Magic','Magic','Magic','Final','18'];const rc=['#4a9c5e','#4a9c5e','#4a9c5e','#5bb867','#5bb867','#5bb867','#3d8b6e','#3d8b6e','#6b7fa8','#6b7fa8','#6b7fa8','#8b6bb8','#8b6bb8','#c06bb8','#c06bb8','#c06bb8','#d4a040','#ffd700'];const s=el('div','scr');
let ex='';if(i===16)ex='<p style="color:var(--gold);margin-top:16px;animation:fl 2s infinite;font-weight:700">One piece remains...</p>';
s.innerHTML='<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,'+rc[i]+'15,var(--dark))"></div><div style="position:relative;z-index:2;background:rgba(255,255,255,.03);border:1px solid rgba(255,215,0,.1);border-radius:20px;padding:36px;max-width:540px;width:88%;backdrop-filter:blur(6px);text-align:center"><div style="font:700 10px/1 inherit;letter-spacing:3px;color:'+rc[i]+';text-transform:uppercase;margin-bottom:12px;opacity:.7">'+rn[i]+'</div><h1 style="font:900 clamp(34px,7vw,52px)/1.1 inherit;color:var(--gold);text-shadow:0 2px 0 #b8860b,0 0 16px rgba(255,215,0,.3);margin-bottom:24px">Chapter '+(i+1)+'</h1><div style="min-height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:24px"><p style="font:400 clamp(14px,3vw,18px)/1.7 inherit;color:rgba(255,255,255,.7)">[CHAPTER_CONTENT_PLACEHOLDER]</p></div>'+ex+'<button class="btn" id="cB">Collect Piece 🧩</button></div>';
s.querySelector('#cB').onclick=()=>{G.done[i]=true;G.p++;burst(cv.width/2,cv.height/2,30);chime();G.p>=18?show('fin'):show('map')};return s};
// FINALE

await sl(8000);st.style.transition='opacity 10s';st.style.opacity='.3'}
show('start');
